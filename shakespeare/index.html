<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>397 Shakespeare Drive &middot; Leased</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --ivory: #faf7f2;
    --green: #33402c;
    --green-deep: #242e1f;
    --brass: #b08d4f;
    --brass-soft: #d8c49a;
    --serif: Georgia, "Times New Roman", Times, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
    font-family: var(--sans);
    color: var(--ivory);
    background:
      radial-gradient(ellipse at 20% -10%, rgba(176, 141, 79, 0.14), transparent 55%),
      linear-gradient(180deg, var(--green-deep) 0%, var(--green) 100%);
  }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.32em;
    font-size: 0.74rem;
    color: var(--brass-soft);
    margin-bottom: 22px;
  }
  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2rem, 6vw, 3.4rem);
    line-height: 1.1;
  }
  .locale {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.1rem;
    color: rgba(250, 247, 242, 0.78);
    margin-top: 14px;
  }
  .rule { width: 64px; height: 1px; background: var(--brass); margin: 30px auto; }
  p.note {
    max-width: 460px;
    margin: 0 auto 36px;
    color: rgba(250, 247, 242, 0.85);
    font-size: 1rem;
    line-height: 1.65;
  }
  .btn {
    display: inline-block;
    padding: 14px 30px;
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    text-decoration: none;
    border-radius: 2px;
    background: var(--brass);
    color: var(--green-deep);
    transition: background 0.25s ease;
  }
  .btn:hover { background: var(--brass-soft); }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Leased</p>
    <h1>397 Shakespeare Drive</h1>
    <p class="locale">Morrisville, North Carolina 27560</p>
    <div class="rule"></div>
    <p class="note">This property has been leased and is no longer available.
       Thank you for your interest.</p>
    <a class="btn" href="../">View Current Availability &rarr;</a>
    <p style="margin-top:28px;font-size:0.85rem;">
      <a href="tenants/" style="color:var(--brass-soft);">Current tenant? Tenant information &rarr;</a>
    </p>
  </main>
</body>
</html>
